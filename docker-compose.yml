services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webvirtcloud
      POSTGRES_USER: webvirtcloud
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webvirtcloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  webvirtcloud:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Point webvirtcloud at the postgres service
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: webvirtcloud
      POSTGRES_USER: webvirtcloud
      POSTGRES_PASSWORD: changeme
      # Comma separated list of allowed hosts (used behind a reverse proxy)
      ALLOWED_HOSTS: "*"
      # Optional: set a fixed SECRET_KEY. If omitted, one is auto-generated
      # and persisted in the wvcdata volume.
      # SECRET_KEY: your-secret-key
      # GID of the host's libvirt group. Lets the container user open the
      # mounted host libvirt socket. Find it on the host with:
      #   getent group libvirt
      LIBVIRT_GID: "${LIBVIRT_GID:-64055}"
    # Add the host libvirt group GID to the container process (works together
    # with the group setup done in the entrypoint).
    group_add:
      - "${LIBVIRT_GID:-64055}"
    ports:
      - "80:80"
    volumes:
      - wvcdata:/var/lib/webvirtcloud
      # Mount the host libvirt socket directory so webvirtcloud can manage the
      # host's libvirt via qemu:///system. The host must be running libvirtd
      # and expose /var/run/libvirt/libvirt-sock (on most distros /var/run is a
      # symlink to /run, so this path is universal). On SELinux hosts append
      # :z to the mount.
      - /var/run/libvirt:/var/run/libvirt
    restart: unless-stopped

volumes:
  pgdata:
  wvcdata:
